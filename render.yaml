services:
  - type: web
    name: bankflow-ml
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /app
      # One uvicorn worker per 512MB instance -- see the CMD note in Dockerfile.
      - key: WEB_CONCURRENCY
        value: "1"
