services:
  - type: web
    name: bankflow-ml
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONPATH
        value: /app
      # One uvicorn worker per 512MB instance -- see the CMD note in Dockerfile.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OCR_PDF_ZOOM
        value: "3.0"
      - key: OCR_MAX_IMAGE_DIMENSION
        value: "2800"
      - key: OCR_ENABLE_HEAVY_PASS
        value: "0"
      - key: OCR_DOCUMENT_TIMEOUT_SECONDS
        value: "25"
      - key: OMP_THREAD_LIMIT
        value: "1"
      - key: EXTRACTION_QUEUE_TIMEOUT_SECONDS
        value: "8"
      - key: SUPABASE_TIMEOUT_SECONDS
        value: "3"
