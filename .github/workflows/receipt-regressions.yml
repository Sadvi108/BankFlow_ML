name: Receipt extraction regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  receipt-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt pytest httpx
      - name: Verify extraction, OCR retries, and API contracts
        run: >-
          python -m pytest -q
          tests/test_label_repair.py
          tests/test_receipt_numeric_recovery.py
          tests/test_ibg_amount.py
          tests/test_ibg_bank_name.py
          tests/test_ibg_reference_id.py
          tests/test_ibg_transaction_date.py
          tests/test_reference_recovery.py
          tests/test_ibg_runtime.py
          tests/test_amount_date_faults.py
          tests/test_api_reference_contract.py
          tests/test_ocr_adaptive.py
